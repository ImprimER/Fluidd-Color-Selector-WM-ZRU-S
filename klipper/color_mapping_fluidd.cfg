# WonderMaker ZR Ultra S 1.1.12 — macro interactive créée pour ce projet.
# Un G-code préparé appelle ORCA_COLOR_SETUP avant son premier changement de tête.
# Le favori de navigateur actuel n'appelle pas cette macro : il écrit directement
# les mêmes variables box_modify_tN avant de lancer le G-code original.
# Installation et paramètres : docs/MACRO_COLOR_MAPPING.md.
# À inclure dans printer.cfg après les fichiers fournis par WonderMaker.

[gcode_macro _ORCA_COLOR_STATE]
variable_used: ''
variable_stage: -1
variable_color0: ''
variable_color1: ''
variable_color2: ''
variable_color3: ''
variable_map0: -1
variable_map1: -1
variable_map2: -1
variable_map3: -1
gcode:
    M118 Etat interne des couleurs OrcaSlicer

[gcode_macro ORCA_COLOR_SETUP]
description: Demander les tetes physiques avant le debut du G-code OrcaSlicer
gcode:
    {% set used = params.USED|default('')|string %}
    {% set colors = [params.C0|default('')|upper, params.C1|default('')|upper, params.C2|default('')|upper, params.C3|default('')|upper] %}
    {% if used not in ['0','1','2','3','01','02','03','12','13','23','012','013','023','123','0123'] %}
        {action_raise_error('Liste des outils OrcaSlicer invalide')}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=used VALUE='"{used}"'
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=stage VALUE={used[0]|int}
        {% for i in range(4) %}
            SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=color{i} VALUE='"{colors[i]}"'
            SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=map{i} VALUE=-1
        {% endfor %}
        _ORCA_COLOR_PROMPT
        M25
    {% endif %}

[gcode_macro _ORCA_COLOR_PROMPT]
gcode:
    {% set state = printer['gcode_macro _ORCA_COLOR_STATE'] %}
    {% set colors = [state.color0, state.color1, state.color2, state.color3] %}
    {% set mapping = [state.map0, state.map1, state.map2, state.map3] %}
    {% set stage = state.stage|int %}
    {% if 0 <= stage < 4 %}
        {% set color = colors[stage] %}
        {% set r = color[0:2]|int(0,16) %}
        {% set g = color[2:4]|int(0,16) %}
        {% set b = color[4:6]|int(0,16) %}
        RESPOND TYPE=command MSG="action:prompt_begin Couleurs OrcaSlicer"
        RESPOND TYPE=command MSG="action:prompt_text Couleur du modele T{stage}"
        RESPOND TYPE=command MSG="action:prompt_button ⠀⠀⠀⠀⠀⠀|_ORCA_COLOR_PROMPT|rgb({r},{g},{b})"
        RESPOND TYPE=command MSG="action:prompt_text Choisir la tete physique chargee avec cette couleur."
        {% for head in range(4) %}
            RESPOND TYPE=command MSG="action:prompt_button T{head} physique|_ORCA_COLOR_PICK SLOT={stage} HEAD={head}"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Annuler|_ORCA_COLOR_CANCEL"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif stage == 4 %}
        RESPOND TYPE=command MSG="action:prompt_begin Verifier les couleurs OrcaSlicer"
        {% set seen = [] %}
        {% set duplicates = [] %}
        {% for i in range(4) %}
            {% if i|string in state.used %}
                {% set color = colors[i] %}
                {% set r = color[0:2]|int(0,16) %}
                {% set g = color[2:4]|int(0,16) %}
                {% set b = color[4:6]|int(0,16) %}
                {% if mapping[i] in seen and mapping[i] not in duplicates %}
                    {% set _ = duplicates.append(mapping[i]) %}
                {% endif %}
                {% set _ = seen.append(mapping[i]) %}
                RESPOND TYPE=command MSG="action:prompt_text Couleur T{i} vers T{mapping[i]} physique"
                RESPOND TYPE=command MSG="action:prompt_button ⠀⠀⠀⠀⠀⠀|_ORCA_COLOR_PROMPT|rgb({r},{g},{b})"
            {% endif %}
        {% endfor %}
        {% for head in duplicates %}
            RESPOND TYPE=command MSG="action:prompt_text ATTENTION : plusieurs couleurs utilisent T{head} physique."
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Confirmer et imprimer|_ORCA_COLOR_CONFIRM"
        RESPOND TYPE=command MSG="action:prompt_footer_button Recommencer|_ORCA_COLOR_RESTART"
        RESPOND TYPE=command MSG="action:prompt_footer_button Annuler|_ORCA_COLOR_CANCEL"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _ORCA_COLOR_PICK]
gcode:
    {% set state = printer['gcode_macro _ORCA_COLOR_STATE'] %}
    {% set slot = params.SLOT|default(-1)|int %}
    {% set head = params.HEAD|default(-1)|int %}
    {% if slot != state.stage|int or slot < 0 or slot > 3 or head < 0 or head > 3 %}
        {action_raise_error('Choix de tete invalide')}
    {% else %}
        {% set mapping = [state.map0|int, state.map1|int, state.map2|int, state.map3|int] %}
        {% set previous = [] %}
        {% for i in range(4) %}
            {% if i|string in state.used and i != slot and mapping[i] == head %}
                {% set _ = previous.append(i) %}
            {% endif %}
        {% endfor %}
        {% if previous %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_begin Tete physique deja choisie"
            RESPOND TYPE=command MSG="action:prompt_text T{head} physique est deja attribuee a la couleur T{previous[0]} du modele."
            RESPOND TYPE=command MSG="action:prompt_text Si vous continuez, ces couleurs sortiront de la meme tete."
            RESPOND TYPE=command MSG="action:prompt_button Choisir une autre tete|_ORCA_COLOR_RECHOOSE"
            RESPOND TYPE=command MSG="action:prompt_footer_button Utiliser quand meme|_ORCA_COLOR_ACCEPT SLOT={slot} HEAD={head}"
            RESPOND TYPE=command MSG="action:prompt_footer_button Annuler|_ORCA_COLOR_CANCEL"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
            _ORCA_COLOR_ACCEPT SLOT={slot} HEAD={head}
        {% endif %}
    {% endif %}

[gcode_macro _ORCA_COLOR_RECHOOSE]
gcode:
    {% if printer['gcode_macro _ORCA_COLOR_STATE'].stage|int < 0 %}
        {action_raise_error('Aucune demande de couleurs en cours')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        _ORCA_COLOR_PROMPT
    {% endif %}

[gcode_macro _ORCA_COLOR_ACCEPT]
gcode:
    {% set state = printer['gcode_macro _ORCA_COLOR_STATE'] %}
    {% set slot = params.SLOT|default(-1)|int %}
    {% set head = params.HEAD|default(-1)|int %}
    {% if slot != state.stage|int or slot < 0 or slot > 3 or head < 0 or head > 3 %}
        {action_raise_error('Choix de tete invalide')}
    {% else %}
        {% set remaining = [] %}
        {% for i in range(slot+1,4) %}
            {% if i|string in state.used %}
                {% set _ = remaining.append(i) %}
            {% endif %}
        {% endfor %}
        {% set next_stage = remaining[0] if remaining else 4 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=map{slot} VALUE={head}
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=stage VALUE={next_stage}
        _ORCA_COLOR_PROMPT
    {% endif %}

[gcode_macro _ORCA_COLOR_RESTART]
gcode:
    {% set state = printer['gcode_macro _ORCA_COLOR_STATE'] %}
    {% if not state.used or state.stage|int < 0 %}
        {action_raise_error('Aucun choix de couleur en cours')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% for i in range(4) %}
            SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=map{i} VALUE=-1
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=stage VALUE={state.used[0]|int}
        _ORCA_COLOR_PROMPT
    {% endif %}

[gcode_macro _ORCA_COLOR_CONFIRM]
gcode:
    {% set state = printer['gcode_macro _ORCA_COLOR_STATE'] %}
    {% set mapping = [state.map0|int, state.map1|int, state.map2|int, state.map3|int] %}
    {% set selected = [] %}
    {% for i in range(4) %}
        {% if i|string in state.used %}
            {% set _ = selected.append(mapping[i]) %}
        {% endif %}
    {% endfor %}
    {% if state.stage|int != 4 or not selected or selected|min < 0 or selected|max > 3 %}
        {action_raise_error('Correspondance OrcaSlicer incomplete')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=stage VALUE=-1
        {% for i in range(4) %}
            {% if i|string in state.used %}
                SAVE_VARIABLE VARIABLE=box_modify_t{i} VALUE={mapping[i]}
                SAVE_VARIABLE VARIABLE=box_modify_t{i}_backup VALUE={mapping[i]}
            {% endif %}
        {% endfor %}
        M24
    {% endif %}

[gcode_macro _ORCA_COLOR_CANCEL]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_ORCA_COLOR_STATE VARIABLE=stage VALUE=-1
    SDCARD_RESET_FILE

[gcode_macro COULEURS_REOUVRIR]
description: Rouvrir la demande de correspondance si Fluidd l'a masquee
gcode:
    {% if printer['gcode_macro _ORCA_COLOR_STATE'].stage|int < 0 %}
        {action_raise_error('Aucune demande de couleurs en cours')}
    {% else %}
        _ORCA_COLOR_PROMPT
    {% endif %}

[gcode_macro COULEURS_ANNULER]
description: Annuler une impression en attente de correspondance
gcode:
    {% if printer['gcode_macro _ORCA_COLOR_STATE'].stage|int < 0 %}
        {action_raise_error('Aucune demande de couleurs en cours')}
    {% else %}
        _ORCA_COLOR_CANCEL
    {% endif %}

[gcode_macro COLOR_MAPPING_STATUS]
description: Afficher la correspondance actuellement enregistree
gcode:
    {% set v = printer.save_variables.variables %}
    RESPOND MSG="T0 modele vers T{v.box_modify_t0} physique"
    RESPOND MSG="T1 modele vers T{v.box_modify_t1} physique"
    RESPOND MSG="T2 modele vers T{v.box_modify_t2} physique"
    RESPOND MSG="T3 modele vers T{v.box_modify_t3} physique"
