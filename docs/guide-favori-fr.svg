<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Exemple dans le favori Fluidd</title>
<desc id="desc">Four numbered callouts show file selection, printer colors, model-to-toolhead mapping, and print confirmation.</desc>
<rect width="1120" height="720" fill="#edf2f6"/>
<rect x="260" y="55" width="600" height="610" rx="16" fill="#25262a" stroke="#4c525a" stroke-width="2"/>
<text x="284" y="100" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="23" font-weight="700">Imprimer avec les couleurs</text>
<text x="284" y="141" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="16" font-weight="700">1. Choisir le fichier</text>
<rect x="284" y="155" width="552" height="34" rx="5" fill="#35363a" stroke="#666"/>
<text x="296" y="178" fill="#abb4be" font-family="Arial,sans-serif" font-size="15">Rechercher un fichier</text>
<rect x="284" y="197" width="552" height="34" rx="5" fill="#35363a" stroke="#666"/>
<text x="296" y="220" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="15">example.gcode</text>
<text x="817" y="220" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="14">⌄</text>
<rect x="284" y="248" width="552" height="112" rx="7" fill="#25262a" stroke="#565d66"/>
<text x="298" y="273" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Sur l’imprimante</text>
<rect x="733" y="258" width="89" height="28" rx="5" fill="#555a62"/>
<text x="777" y="277" text-anchor="middle" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="13">Actualiser</text>
<rect x="298" y="297" width="124" height="45" rx="5" fill="#303136"/>
<rect x="430" y="297" width="124" height="45" rx="5" fill="#303136"/>
<rect x="562" y="297" width="124" height="45" rx="5" fill="#303136"/>
<rect x="694" y="297" width="128" height="45" rx="5" fill="#303136"/>
<circle cx="316" cy="319" r="11" fill="none" stroke="#9ba5ad" stroke-dasharray="2 2"/>
<circle cx="448" cy="319" r="11" fill="#000" stroke="#9ba5ad"/>
<circle cx="580" cy="319" r="11" fill="#c99542"/>
<circle cx="712" cy="319" r="11" fill="#fff" stroke="#9ba5ad"/>
<text x="334" y="324" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="13">T0 · Vide</text>
<text x="466" y="324" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="13">T1 · Noir</text>
<text x="598" y="324" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="13">T2 · Ocre</text>
<text x="730" y="324" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="13">T3 · Blanc</text>
<text x="284" y="396" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="16" font-weight="700">2. Couleurs du fichier → têtes</text>
<rect x="284" y="410" width="552" height="67" rx="7" fill="#303136"/>
<rect x="284" y="485" width="552" height="67" rx="7" fill="#303136"/>
<circle cx="308" cy="443" r="16" fill="#000" stroke="#a6adb3"/>
<circle cx="308" cy="518" r="16" fill="#fff" stroke="#a6adb3"/>
