<text x="592" y="524" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="15">T3 · Blanc</text>
<rect x="604" y="593" width="86" height="40" rx="6" fill="#555a62"/>
<text x="647" y="619" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14">Fermer</text>
<rect x="699" y="593" width="137" height="40" rx="6" fill="#25a900"/>
<text x="767" y="619" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Confirmer et imprimer</text>
<path d="M 240 176 L 284 212" stroke="#688398" stroke-width="2" fill="none"/>
<rect x="18" y="134" width="222" height="83" rx="12" fill="#fff" stroke="#cad5de"/>
<circle cx="42" cy="159" r="17" fill="#176eaa"/>
<text x="42" y="165" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text>
<text x="68" y="162" fill="#26313d" font-family="Arial,sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">Choisir un G-code</tspan><tspan x="68" dy="24">déjà envoyé à Fluidd</tspan></text>
<path d="M 880 302 L 836 301" stroke="#688398" stroke-width="2" fill="none"/>
<rect x="880" y="247" width="221" height="110" rx="12" fill="#fff" stroke="#cad5de"/>
<circle cx="904" cy="272" r="17" fill="#176eaa"/>
<text x="904" y="278" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">2</text>
<text x="930" y="275" fill="#26313d" font-family="Arial,sans-serif" font-size="17" font-weight="600"><tspan x="930" dy="0">Vérifier les têtes</tspan><tspan x="930" dy="24">et les couleurs</tspan><tspan x="930" dy="24">sur l’imprimante</tspan></text>
<path d="M 240 456 L 284 445" stroke="#688398" stroke-width="2" fill="none"/>
<rect x="18" y="407" width="222" height="105" rx="12" fill="#fff" stroke="#cad5de"/>
<circle cx="42" cy="432" r="17" fill="#176eaa"/>
<text x="42" y="438" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text>
<text x="68" y="435" fill="#26313d" font-family="Arial,sans-serif" font-size="17" font-weight="600"><tspan x="68" dy="0">Associer chaque</tspan><tspan x="68" dy="24">couleur à la tête</tspan><tspan x="68" dy="24">qui la contient</tspan></text>
<path d="M 880 621 L 836 610" stroke="#688398" stroke-width="2" fill="none"/>
<rect x="880" y="574" width="221" height="94" rx="12" fill="#fff" stroke="#cad5de"/>
<circle cx="904" cy="599" r="17" fill="#176eaa"/>
<text x="904" y="605" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">4</text>
<text x="930" y="602" fill="#26313d" font-family="Arial,sans-serif" font-size="17" font-weight="600"><tspan x="930" dy="0">Vérifier puis lancer</tspan><tspan x="930" dy="24">l’impression</tspan></text>
</svg>
