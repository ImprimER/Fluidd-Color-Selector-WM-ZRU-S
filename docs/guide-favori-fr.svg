<text x="335" y="524" fill="#f3f5f7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Couleur 3</text>
<text x="524" y="450" fill="#b8c2c9" font-family="Arial,sans-serif" font-size="21">→</text>
<text x="524" y="525" fill="#b8c2c9" font-family="Arial,sans-serif" font-size="21">→</text>
<rect x="554" y="424" width="266" height="38" rx="5" fill="#35363a" stroke="#666"/>
<rect x="554" y="499" width="266" height="38" rx="5" fill="#35363a" stroke="#666"/>
